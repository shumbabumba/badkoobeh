<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Badkoobeh</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            defer></script>

    <script src="ghostbook.js" defer></script>
</head>

<body>

    <div id="map"></div>

    <div id="interface">

        <div id="description">
            <div id="title">BADKOOBEH</div>

            <div id="languages">
                <span>eng</span>
                <span>|</span>
                <span>aze</span>
            </div>
        </div>


        <div id="weather-card">

            <div class="weather-location">
                <div>Baku, Azerbaijan</div>

                <div class="weather-time">
                    <span id="datetime"></span>
                    <span class="live">LIVE</span>
                </div>
            </div>


            <div class="temperature">
                <span id="temperature"></span>
                <sup>°C</sup>
            </div>


            <div class="weather-line"></div>


            <div class="weather-details">

                <div>
                    <span>Wind</span>
                    <strong id="wind">km/h</strong>
                </div>

                <div>
                    <span>Direction</span>
                    <strong id="direction"></strong>
                </div>

                <div>
                    <span>Humidity</span>
                    <strong id="humidity">%</strong>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
